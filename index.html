<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#203c32" />
    <meta name="description" content="Six gravel rallies through the forests, lakes and highlands of Småland. Beat your best and watch for wildlife." />
    <title>Småland Racer</title>
  </head>
  <body>
    <div id="app">
      <main id="viewport"></main>
      <header class="masthead"><button id="home" class="wordmark">SMÅLAND<span>RACER</span></button><div class="header-right"><span id="mode-label" class="edition"></span><label class="language"><span id="language-label"></span><select id="language"><option value="en">English</option><option value="nl">Nederlands</option><option value="sv">Svenska</option></select></label><button id="pause-button" class="quiet"></button></div></header>
      <div id="menus"></div>
      <section id="race-hud" hidden>
        <aside class="timing"><span id="time-label" class="eyebrow"></span><strong id="race-time">0:00.00</strong><div id="split"></div><div class="checkpoint-line"><span id="checkpoint-label"></span><span id="checkpoint-count"></span></div><div class="progress-track"><i id="progress-fill"></i></div></aside>
        <aside class="route-card"><div class="route-heading"><span id="course-name"></span><span id="surface"></span></div><div class="map-tools"><button id="tuning-toggle" type="button" role="switch" aria-checked="false" aria-controls="tuning-panel" aria-label="Driving tuning mode"></button></div><section id="tuning-panel" aria-label="Driving settings" hidden><div class="tuning-heading"><strong><span id="tuning-style"></span> tuning</strong><button id="tuning-copy" type="button" title="Copy all driving settings as JSON" aria-label="Copy all driving settings as JSON"></button></div><p class="tuning-hint">Adjust live. Click the road to drive. ↑ + ←/→: auto drift at speed. SPACE: handbrake.</p><div id="tuning-controls"></div><div class="tuning-bottom"><button id="tuning-reset" type="button">Reset style &amp; ice</button><span id="tuning-status" role="status">Changes apply live and save on this device.</span></div><textarea id="tuning-export" aria-label="Driving settings JSON" readonly hidden></textarea></section><svg id="route-map" role="img"><g id="map-landscape"></g><path id="map-track"/><g id="map-gates"></g><circle id="map-car" r="5"/></svg><div id="route-footer" class="route-footer"><span id="route-length"></span><span id="route-type"></span></div></aside>
        <footer class="dashboard"><div class="drive-tools"><div class="condition-heading"><span id="condition-label"></span><strong id="condition-value"></strong></div><div class="condition-track"><i id="condition-fill"></i></div><div class="controls" id="keyboard-controls"><span><kbd>WASD / <span id="keyboard-arrows" aria-hidden="true"></span></kbd><span id="drive-label"></span></span><span><kbd>SPACE</kbd><span id="handbrake-label"></span></span><button id="recover-button"><kbd>R</kbd><span id="recover-label"></span></button></div><p id="touch-controls" class="touch-controls" hidden></p></div><div class="speedometer"><span id="gear">N</span><strong id="speed">000</strong><span class="speed-unit">KM/H<span>GRAVEL CLUB</span></span></div></footer>
      </section>
      <div id="countdown" hidden aria-live="assertive"></div>
      <div id="toast" role="status" hidden></div>
      <div id="impact-flash"></div>
      <div id="storage-warning" role="status" hidden></div>
      <div id="error" role="alert" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
